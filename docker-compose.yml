# Docker Compose for Environmental Sensor Pipeline
#
# Usage:
#   docker-compose up -d          # Start in background
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop and remove
#
# For Yale Spinup Windows VMs:
#   Ensure Docker Desktop is configured with a non-conflicting IP range.
#   Add to Docker daemon.json: {"default-address-pools": [{"base": "192.168.200.0/24", "size": 24}]}

services:
  sensorpull:
    build: .
    container_name: sensorpull
    ports:
      - "8888:8888"
    environment:
      # Data pull configuration
      - DAYS_BACK=${DAYS_BACK:-730}
      - TESTING=${TESTING:-False}

      # Enable/disable data sources
      - CORIS_ENABLED=${CORIS_ENABLED:-False}
      - CONSERV_ENABLED=${CONSERV_ENABLED:-False}
      - LICOR_ENABLED=${LICOR_ENABLED:-False}

      # API credentials (set in .env file or environment)
      - CATS_USER_ID=${CATS_USER_ID:-}
      - CORIS_API_KEY=${CORIS_API_KEY:-}
      - CONSERV_API_KEYS=${CONSERV_API_KEYS:-}
      - LICOR_API_KEY=${LICOR_API_KEY:-}

    volumes:
      # Persist data between container restarts
      - sensor_data:/src/data

      # Optional: mount local .env file
      # - ./.env:/src/.env:ro

    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.isdir('/src/data')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sensor_data:
    name: environmental_sensor_data
